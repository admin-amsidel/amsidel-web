<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Amsidel Enterprises Private Limited</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Amsidel Doors & Windows: uPVC, aluminium, WPC and steel doors and windows, plus safety, ABS, membrane, laminated, skin and fibre doors.">
  <meta name="theme-color" content="#1E1E21">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="preload" as="image" href="brand/amsidel-mark.png">
  <!-- Page loader: inline so it shows before the app downloads; App hides it (see app.ts). -->
  <style>
    #app-loader {
      position: fixed; inset: 0; z-index: 1000;
      display: grid; place-items: center; align-content: center; gap: 22px;
      background: #fff;
      transition: opacity .2s ease, visibility 0s;
    }
    /* during saves and refreshes inside a page: the page stays visible behind the logo */
    #app-loader.is-busy { background: rgba(255, 255, 255, .72); cursor: progress; }
    #app-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .45s ease, visibility 0s .45s; }
    .ldr { position: relative; width: 156px; height: 156px; display: grid; place-items: center; }
    /* soft gold glow that breathes behind the logo */
    .ldr::before {
      content: ""; position: absolute; inset: -18px; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(216, 182, 118, .45), rgba(216, 182, 118, 0));
      animation: ldr-glow 2.4s ease-in-out infinite;
    }
    .ldr__disc {
      position: relative; z-index: 1; width: 118px; height: 118px; border-radius: 50%;
      display: grid; place-items: center; background: #fff;
      box-shadow: 0 10px 30px rgba(30, 30, 33, .14), inset 0 0 0 1px #eee9e1;
    }
    .ldr__disc img { width: 72%; height: auto; }
    /* aura rings: a gold arc sweeping forward then back, and a thin charcoal arc going the other way */
    .ldr__aura {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(216, 182, 118, 0) 0 50%, rgba(216, 182, 118, .35) 70%, #d8b676 90%, #8f6d38 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
      animation: ldr-sweep 1.6s cubic-bezier(.65, 0, .35, 1) infinite alternate;
    }
    .ldr__aura--back {
      inset: 10px;
      background: conic-gradient(from 180deg, rgba(30, 30, 33, 0) 0 60%, rgba(30, 30, 33, .25) 80%, #1e1e21 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      animation-name: ldr-sweep-back;
    }
    .ldr__name {
      margin: 0; font-family: 'Marcellus', 'Times New Roman', serif; font-size: 15px;
      letter-spacing: .42em; text-indent: .42em; color: #8f6d38;
    }
    @keyframes ldr-sweep { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    @keyframes ldr-sweep-back { from { transform: rotate(0); } to { transform: rotate(-360deg); } }
    @keyframes ldr-glow { 0%, 100% { opacity: .35; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.05); } }
    /* phones: a smaller ring and logo */
    @media (max-width: 560px) {
      #app-loader { gap: 16px; }
      .ldr { width: 124px; height: 124px; }
      .ldr::before { inset: -14px; }
      .ldr__disc { width: 94px; height: 94px; }
      .ldr__aura { -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); }
      .ldr__aura--back { inset: 8px; -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); }
      .ldr__name { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ldr__aura { animation-duration: 4s; }
      .ldr::before { animation: none; opacity: .6; }
    }

    /* Doors & Windows pages (class is-dw): a casement window whose two glass sashes swing open around the ASD mark.
       The ring loader above stays for the Amsidel Group page. */
    .win, .win-name { display: none; }
    #app-loader.is-dw .ldr, #app-loader.is-dw .ldr__name { display: none; }
    #app-loader.is-dw .win { display: block; }
    #app-loader.is-dw .win-name { display: block; }
    .win { position: relative; width: 136px; height: 150px; border: 6px solid #2a2a2e; border-radius: 3px; perspective: 520px; background: #fff; }
    .win__room {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: radial-gradient(closest-side, rgba(216, 182, 118, .55), rgba(216, 182, 118, 0) 80%), #fffdf8;
      animation: win-glow 2.4s ease-in-out infinite;
    }
    .win__room img { width: 64%; height: auto; }
    .win__sash {
      position: absolute; top: 0; bottom: 0; width: 50%;
      border: 4px solid #2a2a2e;
      background:
        linear-gradient(#2a2a2e, #2a2a2e) center / 100% 3px no-repeat,
        linear-gradient(135deg, rgba(255, 255, 255, .85) 0%, rgba(216, 182, 118, .45) 45%, rgba(255, 255, 255, .7) 60%, rgba(176, 138, 78, .35) 100%);
      -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
      animation: 2.4s cubic-bezier(.45, 0, .25, 1) infinite;
    }
    /* gold handles on the meeting edges */
    .win__sash::after { content: ""; position: absolute; top: 50%; width: 4px; height: 14px; margin-top: -7px; border-radius: 2px; background: #b08a4e; }
    .win__sash--l { left: 0; transform-origin: left center; animation-name: win-left; }
    .win__sash--l::after { right: 3px; }
    .win__sash--r { right: 0; transform-origin: right center; animation-name: win-right; }
    .win__sash--r::after { left: 3px; }
    .win-name {
      margin: 0; font-family: 'Marcellus', 'Times New Roman', serif; font-size: 14px; line-height: 1.6;
      letter-spacing: .38em; text-indent: .38em; color: #8f6d38; text-align: center;
    }
    .win-name small { display: block; font-family: 'Figtree', system-ui, sans-serif; font-size: 10px; letter-spacing: .32em; color: #66625c; }
    /* opens straight away (fully open by ~0.5s, so even a short page change shows it), holds, closes, repeats */
    @keyframes win-left { 0% { transform: rotateY(0); } 20%, 58% { transform: rotateY(-66deg); } 84%, 100% { transform: rotateY(0); } }
    @keyframes win-right { 0% { transform: rotateY(0); } 20%, 58% { transform: rotateY(66deg); } 84%, 100% { transform: rotateY(0); } }
    @keyframes win-glow { 0%, 100% { filter: saturate(.6) brightness(1.05); } 20%, 58% { filter: saturate(1.2) brightness(1); } }
    @media (max-width: 560px) {
      .win { width: 112px; height: 124px; border-width: 5px; }
      .win__sash { border-width: 3px; }
      .win-name { font-size: 12px; }
      .win-name small { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .win__sash { animation-duration: 4.8s; }
    }
    /* nothing animates while the loader is hidden */
    #app-loader.is-hidden *, #app-loader.is-hidden *::before { animation-play-state: paused; }
  </style>
  <noscript><style>#app-loader { display: none; }</style></noscript>
</head>
<body>
  <div id="app-loader" role="status" aria-live="polite">
    <div class="ldr">
      <span class="ldr__aura"></span>
      <span class="ldr__aura ldr__aura--back"></span>
      <span class="ldr__disc"><img src="brand/amsidel-mark.png" alt="" width="360" height="160"></span>
    </div>
    <p class="ldr__name">AMSIDEL</p>
    <div class="win">
      <span class="win__room"><img src="brand/amsidel-mark.png" alt="" width="360" height="160"></span>
      <span class="win__sash win__sash--l"></span>
      <span class="win__sash win__sash--r"></span>
    </div>
    <p class="win-name">AMSIDEL<small>DOORS &amp; WINDOWS</small></p>
    <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading…</span>
  </div>
  <!-- pick the loader style before the first paint: casement window on Doors & Windows pages, ring elsewhere -->
  <script>if (/^\/doors-windows(\/|$)/.test(location.pathname)) document.getElementById('app-loader').classList.add('is-dw');</script>
  <app-root></app-root>
  <!-- safety net: never leave the loader up if the app fails to start -->
  <script>setTimeout(function () { var l = document.getElementById('app-loader'); if (l) l.classList.add('is-hidden'); }, 15000);</script>
</body>
</html>
